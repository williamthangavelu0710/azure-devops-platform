apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
  - hpa.yaml

replicas:
  - name: azure-devops-web
    count: 1

images:
  - name: azure-devops-web
    newName: acrdevopswt20261027.azurecr.io/azure-devops-web
    newTag: v3


patches:
  - path: ingress-patch.yaml

configMapGenerator:
  - name: azure-devops-web-config
    files:
      - env.json=config/env.json
