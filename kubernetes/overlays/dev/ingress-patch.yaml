apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azure-devops-web
spec:
  rules:
    - host: azure-devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: azure-devops-web
                port:
                  number: 80
