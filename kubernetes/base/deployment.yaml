apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-devops-web
  labels:
    app: azure-devops-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: azure-devops-web
  template:
    metadata:
      labels:
        app: azure-devops-web
    spec:
      containers:
        - name: web
          image: azure-devops-web:v3
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
