apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azure-devops-web
  labels:
    app: azure-devops-web
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: azure-devops-web
                port:
                  number: 80
