name: Azure DevOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Dependencies
        working-directory: ./site
        run: npm ci

      - name: Validate HTML
        run: make lint

      - name: Build Docker Image
        run: docker build --platform linux/amd64 --build-arg GIT_SHA="${{ github.sha }}" -t azure-devops-web:ci ./site

      - name: Smoke Test Health Endpoint
        run: |
          docker run -d --name ci-web -p 18080:8080 azure-devops-web:ci
          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:18080/healthz | grep -qx ok; then
              echo "PASS: /healthz returned HTTP 200 and ok"
              exit 0
            fi
            sleep 2
          done
          docker logs ci-web
          exit 1

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: azure-devops-web:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  terraform:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.1'

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate
      - name: Scan Terraform Configuration with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
