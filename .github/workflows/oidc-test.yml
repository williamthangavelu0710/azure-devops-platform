name: DEV OIDC Authentication Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-oidc:
    name: Verify DEV Azure OIDC
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Azure Login Using OIDC
        uses: azure/login@v3
        with:
          client-id: 7daaaae5-8fcc-40c8-ac29-98bc96e0bad2
          tenant-id: 4f6d9379-ac8b-476f-80a3-67dbf739dc36
          subscription-id: 65dd607e-b509-4892-814d-65691a35f21b

      - name: Verify Azure Authentication
        run: |
          set -euo pipefail

          echo "Checking authenticated Azure subscription..."

          ACTUAL=$(az account show --query id -o tsv)
          EXPECTED="65dd607e-b509-4892-814d-65691a35f21b"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected Azure subscription."
            exit 1
          fi

          echo "PASS: GitHub Actions authenticated to Azure using OIDC."
