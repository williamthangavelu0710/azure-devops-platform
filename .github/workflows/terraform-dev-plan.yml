name: Terraform DEV Plan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform DEV Drift Detection
    runs-on: ubuntu-latest
    environment: dev

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: "7daaaae5-8fcc-40c8-ac29-98bc96e0bad2"
      ARM_TENANT_ID: "4f6d9379-ac8b-476f-80a3-67dbf739dc36"
      ARM_SUBSCRIPTION_ID: "65dd607e-b509-4892-814d-65691a35f21b"
      TF_VAR_subscription_id: "65dd607e-b509-4892-814d-65691a35f21b"
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.1'

      - name: Azure Login Using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Initialize Existing Terraform Backend
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-azure-devops-platform-shared" \
            -backend-config="storage_account_name=stdevopswtstate20261028" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=platform.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Select DEV Workspace
        working-directory: terraform
        run: terraform workspace select dev

      - name: Terraform DEV Plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -detailed-exitcode
