name: Azure DevOps Platform CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Display Deployment Environment
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          echo "Preparing deployment for: $DEPLOY_ENV"
          echo "Azure deployment is not enabled yet."
