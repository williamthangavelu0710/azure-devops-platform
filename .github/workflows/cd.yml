name: Azure DevOps Platform CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev

permissions:
  id-token: write
  contents: read

jobs:
  deployment:
    name: Test DEV Authentication
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: 7daaaae5-8fcc-40c8-ac29-98bc96e0bad2
          tenant-id: 4f6d9379-ac8b-476f-80a3-67dbf739dc36
          subscription-id: 65dd607e-b509-4892-814d-65691a35f21b

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1

      - name: Get AKS Credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-azure-devops-platform-dev
          cluster-name: aks-azure-devops-platform-dev
          use-kubelogin: true

      - name: Test Kubernetes Authentication
        run: |
          echo "Checking Kubernetes identity..."
          kubectl auth whoami

          echo "Checking DEV deployment permissions..."
          kubectl auth can-i patch deployments.apps -n dev
