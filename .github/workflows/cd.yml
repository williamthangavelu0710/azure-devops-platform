name: Azure DevOps Platform CD

on:
  workflow_run:
    workflows:
      - Azure DevOps Platform CI
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-devops-platform-dev-deployment
  cancel-in-progress: false

jobs:
  changes:
    name: Detect DEV Deployment Changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect Relevant Changes
        id: filter
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -Eq "^(site/|kubernetes/base/|kubernetes/overlays/dev/|kubernetes/rbac/dev/)"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deployment:
    name: Deploy to DEV
    needs: changes
    if: ${{ vars.DEV_DEPLOY_ENABLED == 'true' && needs.changes.outputs.deploy == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'williamthangavelu0710/azure-devops-platform' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: 7daaaae5-8fcc-40c8-ac29-98bc96e0bad2
          tenant-id: 4f6d9379-ac8b-476f-80a3-67dbf739dc36
          subscription-id: 65dd607e-b509-4892-814d-65691a35f21b

      - name: Publish Git SHA Image to ACR
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ACR_NAME=acrdevopswt20261027
          IMAGE="$ACR_NAME.azurecr.io/azure-devops-web:$IMAGE_SHA"

          az acr login --name "$ACR_NAME"
          docker build --platform linux/amd64 --build-arg APP_VERSION="$IMAGE_SHA" -t "$IMAGE" ./site
          docker push "$IMAGE"
          echo "Published $IMAGE"

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Get AKS Credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-azure-devops-platform-dev
          cluster-name: aks-azure-devops-platform-dev
          use-kubelogin: true

      - name: Test Kubernetes Authentication
        run: |
          echo "Checking Kubernetes identity..."
          kubectl auth whoami

          echo "Checking DEV deployment permissions..."
          kubectl auth can-i patch deployments.apps -n dev --quiet

      - name: Deploy Application to AKS DEV
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cp -R kubernetes /tmp/azure-dev-kubernetes
          cd /tmp/azure-dev-kubernetes/overlays/dev
          sed -i "s|newTag: v3|newTag: $IMAGE_SHA|" kustomization.yaml
          kubectl apply -k .

      - name: Verify Application Rollout and Roll Back on Failure
        run: |
          if ! kubectl rollout status deployment/azure-devops-web -n dev --timeout=180s; then
            echo "::error::DEV rollout failed. Restoring previous revision."
            kubectl rollout undo deployment/azure-devops-web -n dev
            kubectl rollout status deployment/azure-devops-web -n dev --timeout=180s
            exit 1
          fi
          echo "DEV rollout successful."

      - name: Smoke Test DEV Deployment
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          kubectl -n dev port-forward deployment/azure-devops-web \
            18081:8080 > /tmp/dev-portforward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          if ! bash scripts/smoke.sh http://127.0.0.1:18081 "$IMAGE_SHA"; then
            echo "::error::DEV smoke test failed; rolling back."
            cat /tmp/dev-portforward.log
            kubectl rollout undo deployment/azure-devops-web -n dev
            kubectl rollout status deployment/azure-devops-web -n dev --timeout=180s
            exit 1
          fi

          echo "PASS: DEV deployment smoke test"
