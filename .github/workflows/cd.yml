name: Azure DevOps Platform CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: 7daaaae5-8fcc-40c8-ac29-98bc96e0bad2
          tenant-id: 4f6d9379-ac8b-476f-80a3-67dbf739dc36
          subscription-id: 65dd607e-b509-4892-814d-65691a35f21b
          allow-no-subscriptions: true

      - name: Display Deployment Environment
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          echo "Preparing deployment for: $DEPLOY_ENV"
          echo "Azure deployment is not enabled yet."
